<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простая викторина</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
     <script>
        // Массив вопросов и правильных ответов
        const quiz = [
            {
                question: "Какой цвет небо?",
                options: ["1. Красный", "2. Синий", "3. Зеленый"],
                correctAnswer: 2 // номер правильного ответа
            },
            {
                question: "Сколько дней в неделе?",
                options: ["1. Шесть", "2. Семь", "3. Восемь"],
                correctAnswer: 2
            },
            {
                question: "Сколько у человека пальцев на одной руке?",
                options: ["1. Четыре", "2. Пять", "3. Шесть"],
                correctAnswer: 2
            }
        ];

        // Счетчик правильных ответов 
        let correctCount = 0; 
        // Проходим циклом по каждому объекту в массиве quiz 
        for (let i = 0; i < quiz.length; i++) {
            const currentQuestion = quiz[i]; 
            // Формируем текст вопроса с вариантами ответов для пользователя 
            let questionText = currentQuestion.question + "\n\n"; 

            for (let j = 0; j < currentQuestion.options.length; j++) {
                 questionText += currentQuestion.options[j] + "\n"; 
                }
                let userInput = prompt (questionText);

                // Проверка на отмену или пустой ввод.
                if (userInput === null || userInput.trim() === ""){
                    isGameOver=true;
                    continue;
                }
                
                const userAnswer = parseInt(userInput); 
                if (isNaN(userAnswer) || userAnswer < 1|| userAnswer > currentQuestion.options.length) {
                    alert("Некорректный ввод. Введите номер от 1 до " + currentQuestion.options.length);
                     i--;// Возвращаемся к этому же вопросу
                     continue;

                 } 
                // Проверка на правильный ответ.
                if (userAnswer ===currentQuestion.correctAnswer){
                    correctCount++;
                }
                }
                  // Выводим финальный результат 
                  alert(`Вы ответили правильно на ${correctCount} из ${quiz.length} вопросов.`); 
                         
    </script>
</body>

</html>
